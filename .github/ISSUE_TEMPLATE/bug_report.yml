name: 버그 / 장치 감지 문제
description: 팬이나 조명이 감지되지 않거나 설정이 적용되지 않을 때
body:
  - type: input
    id: version
    attributes:
      label: 프로그램 버전
      placeholder: v1.6.0
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: 메인보드 / CPU / 그래픽카드 모델
    validations:
      required: true
  - type: dropdown
    id: preparation
    attributes:
      label: 실행 준비 상태
      options:
        - PawnIO 설치 + 관리자 권한 실행
        - PawnIO 미설치
        - 일반 권한 실행
        - 잘 모르겠음
  - type: textarea
    id: problem
    attributes:
      label: 화면 안내 문구와 재현 순서
      description: 기대한 동작, 실제 동작, 팬 연결 방식도 알려 주세요. 개인 식별 정보가 든 전체 로그를 공개할 필요는 없습니다.
    validations:
      required: true
