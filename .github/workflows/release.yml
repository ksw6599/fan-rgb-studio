name: Publish release
run-name: Publish release from ${{ github.ref_name }}
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - name: Build and test before publication
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - name: Publish version from the project file
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          [xml]$project = Get-Content ./FanRgbStudio.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a stable three-part project version.' }
          $tag = "v$version"
          $changelog = Get-Content ./CHANGELOG.md -Raw
          $entry = [regex]::Match($changelog, '(?ms)^## \[' + [regex]::Escape($version) + '\].*?(?=^## |\z)')
          if (-not $entry.Success) { throw 'Add the version to CHANGELOG.md before publishing.' }
          $notesPath = Join-Path $env:RUNNER_TEMP 'fan-studio-release-notes.md'
          [IO.File]::WriteAllText($notesPath, $entry.Value)
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json id 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'This version is already published. Increment the project version.' }
          gh release create $tag ./release-build/artifacts/FanRgbStudio-win-x64.zip ./release-build/artifacts/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Fan Studio $tag" --notes-file $notesPath --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
